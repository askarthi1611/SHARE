<mat-card class="dashboard-card">

    <h2>Expenses</h2>

    <mat-form-field appearance="outline">
        <mat-label>Filter</mat-label>

        <mat-select (selectionChange)="filter($event.value)">

            <mat-option value="daily">Daily</mat-option>
            <mat-option value="monthly">Monthly</mat-option>
            <mat-option value="bimonthly">Bi-Monthly</mat-option>
            <mat-option value="quarter">Quarter</mat-option>
            <mat-option value="semi">Semi Annual</mat-option>
            <mat-option value="year">Full Year</mat-option>

        </mat-select>

    </mat-form-field>

    <table mat-table [dataSource]="expenses" class="expense-table">

        <!-- S.No -->
        <ng-container matColumnDef="sno">
            <th mat-header-cell *matHeaderCellDef>S.No</th>
            <td mat-cell *matCellDef="let e;">{{e.sno}} </td>
        </ng-container>
        <!-- Title -->
        <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef>Title</th>
            <td mat-cell *matCellDef="let e"><span title="{{e.description}}" style="cursor: pointer;">👁️</span> {{e.title}} </td>
        </ng-container>

        <!-- Amount -->
        <ng-container matColumnDef="amount">
            <th mat-header-cell *matHeaderCellDef>Amount</th>
            <td mat-cell *matCellDef="let e">₹{{e.amount}}</td>
        </ng-container>

        <!-- Category -->
        <ng-container matColumnDef="category">
            <th mat-header-cell *matHeaderCellDef>Category</th>
            <td mat-cell *matCellDef="let e">{{e.category}}</td>
        </ng-container>

        <!-- Date -->
        <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef>Date</th>
            <td mat-cell *matCellDef="let e">{{e.date | date}}</td>
        </ng-container>

        <!-- Actions -->
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>

            <td mat-cell *matCellDef="let e">

                <button mat-icon-button color="primary" (click)="editExpense(e)">
                    <mat-icon>edit</mat-icon>
                </button>

                <button mat-icon-button color="warn" (click)="deleteExpense(e._id)">
                    <mat-icon>delete</mat-icon>
                </button>

            </td>

        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;let i = $index"></tr>

    </table>

</mat-card>
