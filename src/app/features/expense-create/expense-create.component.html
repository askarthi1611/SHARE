<mat-card class="glass-card">

    <h2>{{title}} Expense</h2>

    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Title</mat-label>

        <input matInput [(ngModel)]="expense.title" [matAutocomplete]="auto" (input)="filterTitles()" />

        <mat-autocomplete #auto="matAutocomplete">
            <mat-option *ngFor="let option of filteredTitles" [value]="option">
                {{ option }}
            </mat-option>
        </mat-autocomplete>

    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Amount</mat-label>
        <input matInput type="number" [(ngModel)]="expense.amount">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Category</mat-label>
        <mat-select [(ngModel)]="expense.category">

            <mat-option value="Food">Food</mat-option>
            <mat-option value="Travel">Travel</mat-option>
            <mat-option value="Entertainment">Entertainment</mat-option>
            <mat-option value="Shopping">Shopping</mat-option>
            <mat-option value="Medical">Medical</mat-option>
            <mat-option value="Utilities">Utilities</mat-option>
            <mat-option value="Other">Other</mat-option>

        </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Date</mat-label>
        <input matInput [matDatepicker]="picker" [(ngModel)]="expense.date">
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Location</mat-label>
        <input matInput [placeholder]="locationPlaceholder" [(ngModel)]="expense.location">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Description</mat-label>
        <textarea matInput [(ngModel)]="expense.description" rows="3"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Payment Method</mat-label>
        <mat-select [(ngModel)]="expense.paymentMethod">
            <mat-option value="Cash">Cash</mat-option>
            <mat-option value="SBI Credit Card">SBI Credit Card</mat-option>
            <mat-option value="Flipkart Axis Credit Card">Flipkart Axis Credit Card</mat-option>
            <mat-option value="Debit Card">Debit Card</mat-option>
            <mat-option value="Gpay">Gpay</mat-option>
        </mat-select>
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="createExpense()">
        {{title}} Expense
    </button>

</mat-card>
